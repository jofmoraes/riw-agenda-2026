name: Bootstrap RIW Agenda

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct application files
        shell: bash
        run: |
          cat .bootstrap/chunk* > /tmp/riw-package.b64
          base64 --decode /tmp/riw-package.b64 > /tmp/riw-package.zip
          unzip -o /tmp/riw-package.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publicar frontend PWA da agenda RIW"
          git push origin main
